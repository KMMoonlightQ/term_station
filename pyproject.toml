[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "term-station"
version = "0.1.3"
description = "A persistent terminal workspace with tabs and a draggable widget dashboard."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["textual>=8.2,<9", "pyte==0.8.2", "psutil>=7.2,<8", "wcwidth>=0.2.13"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.2,<2"]
bundle = ["pyinstaller>=6.22.1,<7"]

[project.scripts]
term-station = "term_station.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/term_station"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
